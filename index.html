<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성운대학교 학생증 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Nanum+Pen+Script&family=Song+Myung&family=Mrs+Saint+Delafield&family=Herr+Von+Muellerhoff&family=Monsieur+La+Doulaise&family=Homemade+Apple&family=La+Belle+Aurore&family=Nanum+Gothic:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f4f2; font-family: 'Noto Sans KR', sans-serif; color: #222; }
  .app { display: flex; min-height: 100vh; }

  /* 미리보기 */
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 28px 24px; position: sticky; top: 0; height: 100vh; }
  .stage h1 { font-size: 17px; margin: 0; color: #1f2f55; }
  .stage .sub { font-size: 11px; color: #999; letter-spacing: 1px; margin: 2px 0 18px; }
  .seg { display: inline-flex; background: #e8e8e5; border-radius: 8px; padding: 3px; margin-bottom: 20px; }
  .seg button { border: none; background: none; padding: 7px 16px; border-radius: 6px; font-family: inherit; font-size: 13px; color: #666; cursor: pointer; }
  .seg button.on { background: #fff; color: #1f2f55; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .cards { flex: 1; display: flex; gap: 22px; align-items: center; justify-content: center; flex-wrap: wrap; align-content: center; }
  .cards.h-mode { flex-direction: column; flex-wrap: nowrap; }
  .card-wrap { text-align: center; }
  .cap { font-size: 12px; color: #aaa; margin-top: 8px; }
  canvas { display: block; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.14); }
  .v { width: 270px; height: 428px; }
  .h { width: 420px; height: 265px; }

  /* 입력 패널 */
  .panel { width: 360px; background: #fff; border-left: 1px solid #e6e6e2; display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; }
  .scroll { flex: 1; overflow-y: auto; padding: 22px 22px 8px; }
  .sec { margin-bottom: 22px; }
  .sec-t { font-size: 12px; font-weight: 700; color: #1f2f55; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid #e1e3e8; border-radius: 6px; font-size: 14px; font-family: inherit; background: #fafafa; }
  select { width: 100%; padding: 8px 10px; border: 1px solid #e1e3e8; border-radius: 6px; font-size: 14px; font-family: inherit; background: #fafafa; }
  input[type=text]:focus { outline: none; border-color: #1f2f55; background: #fff; }
  .only04 { }
  body.mode-new .only04 { display: none; }
  .only-new { display: none; }
  body.mode-new .only-new { display: block; }

  .drop { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1.5px dashed #d5d7dd; border-radius: 8px; cursor: pointer; }
  .drop:hover, .drop.over { border-color: #1f2f55; background: #f6f7fa; }
  .thumb { width: 48px; height: 62px; border-radius: 4px; background: #eceef2 center/cover no-repeat; flex-shrink: 0; }
  .drop-t { font-size: 13px; color: #555; }
  .drop-t small { display: block; font-size: 11px; color: #aaa; margin-top: 2px; }

  .seg.small { display: flex; margin-bottom: 0; }
  .seg.small button { flex: 1; }
  #pad { width: 100%; height: 80px; background: #fff; border: 1.5px dashed #d5d7dd; border-radius: 8px; touch-action: none; cursor: crosshair; box-shadow: none; }
  .fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .fonts button { padding: 6px 8px; border: 1px solid #e1e3e8; background: #fafafa; border-radius: 6px; cursor: pointer; text-align: left; color: #222; }
  .fonts button .fn { display: block; font-family: 'Noto Sans KR', sans-serif; font-size: 10px; color: #999; }
  .fonts button .fs { font-size: 26px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .fonts button.on { border-color: #1f2f55; background: #fff; box-shadow: 0 0 0 1px #1f2f55; }
  .link { background: none; border: none; color: #1f2f55; font-size: 12px; font-family: inherit; cursor: pointer; padding: 6px 0 0; text-decoration: underline; }

  .foot { padding: 14px 22px 18px; border-top: 1px solid #eee; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-family: inherit; cursor: pointer; }
  .btn.main { background: #1f2f55; color: #fff; font-weight: 700; }
  .btns { display: flex; gap: 6px; margin-top: 6px; }
  .btn.sub { background: #f0f0ee; color: #444; font-size: 12px; padding: 9px; }

  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .stage { position: static; height: auto; padding: 20px 12px; }
    .panel { width: 100%; height: auto; position: static; border-left: none; }
    .scroll { overflow: visible; }
    .foot { position: sticky; bottom: 0; background: #fff; }
    .v { width: 160px; height: 254px; }
    .h { width: 92vw; max-width: 420px; height: auto; aspect-ratio: 660 / 416; }
    .cards { gap: 12px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="stage">
    <h1>성운대학교 학생증 메이커</h1>
    <div class="sub">SUNGWOON UNIVERSITY STUDENT ID</div>
    <div class="seg" id="styleSeg">
      <button type="button" data-style="2004" class="on">2004년형</button>
      <button type="button" data-style="new">세로형</button>
    </div>
    <div class="cards" id="cards">
      <div class="card-wrap"><canvas id="card" width="660" height="416"></canvas><div class="cap">앞면</div></div>
      <div class="card-wrap"><canvas id="back" width="660" height="416"></canvas><div class="cap">뒷면</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="scroll">

      <div class="sec">
        <div class="sec-t">증명사진</div>
        <label class="drop" id="drop">
          <div class="thumb" id="thumb"></div>
          <div class="drop-t">증명사진 올리기<small>클릭하거나 끌어다 놓기</small></div>
          <input type="file" id="photo" accept="image/*" hidden>
        </label>
        <div id="photoAdj" style="display:none;margin-top:10px">
          <label>크기</label>
          <input type="range" id="zoom" min="1" max="3" step="0.01" value="1" style="width:100%;accent-color:#1f2f55">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:11px;color:#aaa">카드 미리보기의 증명사진을 끌어서 위치 조절</span>
            <button type="button" class="link" id="photoReset">초기화</button>
          </div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-t">학교 로고 <span style="font-weight:400;color:#aaa">· 선택</span></div>
        <label class="drop" id="logoDrop">
          <div class="thumb" id="logoThumb" style="width:48px;height:48px;background-size:contain"></div>
          <div class="drop-t">내 로고 올리기<small>교표 자리에 대신 들어가요 (투명 PNG 추천)</small></div>
          <input type="file" id="logoFile" accept="image/*" hidden>
        </label>
        <div style="margin-top:10px">
          <label>크기</label>
          <input type="range" id="logoScale" min="0.5" max="1.8" step="0.01" value="1" style="width:100%;accent-color:#1f2f55">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:11px;color:#aaa">카드 미리보기의 로고를 끌어서 위치 조절</span>
            <button type="button" class="link" id="logoPosReset">위치 초기화</button>
          </div>
        </div>
        <button type="button" class="link" id="logoReset" style="display:none">기본 교표로 되돌리기</button>
      </div>

      <div class="sec">
        <div class="sec-t">카드 배경</div>
        <label>앞면</label>
        <div class="seg small bgseg" data-side="front" style="margin-bottom:6px">
          <button type="button" data-m="default" class="on">기본 무늬</button>
          <button type="button" data-m="none">무늬 없음</button>
          <button type="button" data-m="image">내 이미지</button>
        </div>
        <input type="file" id="bg_front" accept="image/*" hidden>
        <label>뒷면</label>
        <div class="seg small bgseg" data-side="back" style="margin-bottom:6px">
          <button type="button" data-m="default" class="on">기본 무늬</button>
          <button type="button" data-m="none">무늬 없음</button>
          <button type="button" data-m="image">내 이미지</button>
        </div>
        <input type="file" id="bg_back" accept="image/*" hidden>
        <div style="font-size:11px;color:#aaa">내 이미지는 카드 크기에 맞게 꽉 채워져요. 글자가 잘 보이게 어두운 이미지를 추천해요.</div>
      </div>

      <div class="sec">
        <div class="sec-t">학생 정보</div>
        <div class="grid">
          <div><label>이름</label><input type="text" id="name" value="서미르"></div>
          <div><label>영문 이름</label><input type="text" id="eng" value="SEO MIR"></div>
          <div class="full"><label>학과 선택</label><select id="deptSel"></select></div>
          <div><label>단과대학</label><input type="text" id="college" value="경영대학"></div>
          <div><label>학과</label><input type="text" id="dept" value="호텔경영학과"></div>
          <div><label>입학년도</label><input type="text" id="year" value="2000" maxlength="4"></div>
          <div><label>학번 <span style="color:#bbb">· 자동</span></label><input type="text" id="sid" value="" maxlength="12"></div>
          <div class="only04"><label>주민번호</label><input type="text" id="jumin" value="811225-1******" maxlength="14"></div>
          <div><label>발급일</label><input type="text" id="issued" value="2004.03.02" maxlength="10"></div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-t">서명</div>
        <div class="seg small" id="signMode">
          <button type="button" data-m="draw" class="on">직접 그리기</button>
          <button type="button" data-m="none">없음</button>
        </div>
        <div id="signText" style="display:none">
          <input type="text" id="sign" value="Seo Mir" style="margin-top:10px">
          <div class="fonts" id="fonts" style="margin-top:8px"></div>
        </div>
        <div id="signDraw" style="margin-top:10px">
          <canvas id="pad" width="600" height="160"></canvas>
          <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:#aaa;padding-top:6px">마우스나 손가락으로 서명하세요</span><button type="button" class="link" id="padClear">지우기</button></div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-t">카드 정보 <span style="font-weight:400;color:#aaa;">· 학번 넣으면 자동</span></div>
        <div class="grid">
          <div class="full"><label>카드번호</label><input type="text" id="cardno" value="" maxlength="19"></div>
          <div><label>유효기간</label><input type="text" id="valid" value="" maxlength="5"></div>
          <div><label>CVC</label><input type="text" id="cvc" value="" maxlength="3"></div>
        </div>
        <button type="button" class="link" id="rand">카드번호 새로 뽑기</button>
      </div>

    </div>
    <div class="foot">
      <button type="button" class="btn main" id="dl">앞뒷면 한 장으로 저장</button>
      <div class="btns">
        <button type="button" class="btn sub" id="dlF">앞면만</button>
        <button type="button" class="btn sub" id="dlB">뒷면만</button>
      </div>
    </div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const FONT = "'Noto Sans KR', sans-serif";
const SCHOOL = "'Song Myung', 'Noto Serif KR', serif";  // 교표와 같은 학교명 글씨체
const MONO = "'Courier New', monospace";
const NAVY = '#22356b';

const fv = $('card'), f = fv.getContext('2d');
const bv = $('back'), k = bv.getContext('2d');
const FW = 416, FH = 660, BW = 416, BH = 660;
let photoImg = null;
let customLogo = null;                     // 사용자가 올린 학교 로고
// 앞/뒷면 배경: default(기본 무늬) | none(무늬 없음) | image(내 이미지)
const bgMode = { front: 'default', back: 'default' };
const bgUser = { front: null, back: null };
const bgImg = side => bgMode[side] === 'image' ? bgUser[side] : null;
function drawBg(c, img, w, h) {
  const sc = Math.max(w / img.width, h / img.height);
  c.drawImage(img, (w - img.width * sc) / 2, (h - img.height * sc) / 2, img.width * sc, img.height * sc);
}
const L_ = img => customLogo || img;
// 로고 위치/크기 (모든 로고 자리에 같은 비율로 적용)
let logoScale = 1, logoDX = 0, logoDY = 0;      // DX/DY: 로고 칸 크기 대비 비율
const logoRects = new Map();                      // 캔버스별 작은 로고 칸 (드래그용)
function dLogo(c, img, x, y, w, h) {
  const src = customLogo || img;
  let dw = w, dh = h;
  if (customLogo) { const sc = Math.min(w / src.width, h / src.height); dw = src.width * sc; dh = src.height * sc; }
  dw *= logoScale; dh *= logoScale;
  const cx = x + w / 2 + logoDX * w, cy = y + h / 2 + logoDY * h;
  if (w < 120) {
    const list = logoRects.get(c.canvas) || [];
    list.push({ x: cx - dw / 2, y: cy - dh / 2, w: dw, h: dh, bw: w, bh: h, m: c.getTransform() });
    logoRects.set(c.canvas, list);
  }
  c.drawImage(src, cx - dw / 2, cy - dh / 2, dw, dh);
}
// 사진 위치/크기 (드래그·확대)
let photoZoom = 1, photoOX = 0, photoOY = 0;   // OX/OY: -1~1 (cover 상태에서 남는 여백 비율)
const photoRects = new Map();
let photoTarget = null;   // 오프스크린에 그릴 때 실제 카드 캔버스                    // 캔버스별 사진 칸 위치
function fitPhoto(c, px, py, pw, ph) {
  photoRects.set(photoTarget || c.canvas, { x: px, y: py, w: pw, h: ph, m: c.getTransform() });
  c.save();
  c.beginPath(); c.rect(px, py, pw, ph); c.clip();
  const sc = Math.max(pw / photoImg.width, ph / photoImg.height) * photoZoom;
  const dw = photoImg.width * sc, dh = photoImg.height * sc;
  const ex = (dw - pw) / 2, ey = (dh - ph) / 2;
  c.drawImage(photoImg, px - ex + photoOX * ex, py - ey + photoOY * ey, dw, dh);
  c.restore();
}

/* ---------- 서명 ---------- */
// 실제 서명처럼 흘려 쓴 필기체 (영문 서명용) + 한글 손글씨 하나
const SIGN_FONTS = [
  ['Mrs Saint Delafield', '흘림 서명 1', 1.35],
  ['Herr Von Muellerhoff', '흘림 서명 2', 1.3],
  ['Monsieur La Doulaise', '흘림 서명 3', 1.2],
  ['Homemade Apple', '볼펜 필기', 0.8],
  ['La Belle Aurore', '날림 필기', 1.0],
  ['Nanum Pen Script', '한글 손글씨', 1.15]
];
let signFont = SIGN_FONTS[0][0];
let signMode = 'draw';   // text | draw | none
let signPad = null;       // 직접 그린 서명 캔버스
function inkBounds(cv) {
  const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
  let x0 = cv.width, y0 = cv.height, x1 = -1, y1 = -1;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
    if (d[(y * cv.width + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  const m = 4;
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(cv.width - 1, x1 + m); y1 = Math.min(cv.height - 1, y1 + m);
  return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}
function drawSign(c, x, y, w, h) {
  if (signMode === 'none') return;
  c.save();
  if (signMode === 'draw') {
    if (signPad && signPad.dataset.dirty === '1') {
      // 실제로 그린 부분만 잘라서 서명란 안에 꽉 차게 (잘리지 않게)
      const b = inkBounds(signPad);
      if (b) {
        const pad = 6;
        const sc = Math.min((w - pad * 2) / b.w, (h - pad * 2) / b.h);
        const dw = b.w * sc, dh = b.h * sc;
        c.drawImage(signPad, b.x, b.y, b.w, b.h, x + pad + 6, y + (h - dh) / 2, dw, dh);
      }
    }
  } else {
    const scale = (SIGN_FONTS.find(f => f[0] === signFont) || [0, 0, 1])[2];
    let size = Math.round(h * 0.82 * scale);
    c.fillStyle = '#1a1a1a';
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    const txt = $('sign').value;
    c.font = `400 ${size}px '${signFont}', ${FONT}`;
    while (c.measureText(txt).width > w - 24 && size > 10) { size -= 1; c.font = `400 ${size}px '${signFont}', ${FONT}`; }
    c.fillText(txt, x + 12, y + h / 2 + 2);
    c.textBaseline = 'alphabetic';
  }
  c.restore();
}

/* ---------- 로고 (SVG) ---------- */
const SEAL = (col, knock, acc, sub) => `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 300 300">
<circle cx="150" cy="150" r="146" fill="${col}"/>
<circle cx="150" cy="150" r="140" fill="none" stroke="${knock}" stroke-width="1.5"/>
<circle cx="150" cy="150" r="104" fill="${knock}"/>

function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function spaced(c, text, x, y, sp, align) {
  const chars = [...text];
  let total = sp * (chars.length - 1);
  chars.forEach(ch => total += c.measureText(ch).width);
  let sx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  c.textAlign = 'left';
  chars.forEach(ch => { c.fillText(ch, sx, y); sx += c.measureText(ch).width + sp; });
}

function drawStamp(c, x, y, size, rotDeg) {
  if (!ok(stampRed)) return;
  const off = document.createElement('canvas');
  off.width = off.height = 200;
  const o = off.getContext('2d');
  o.drawImage(stampRed, 0, 0, 200, 200);
  // 잉크가 덜 묻은 자국: 정해진 패턴으로 점 지우기
  o.globalCompositeOperation = 'destination-out';
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++) {
    o.globalAlpha = 0.25 + rnd() * 0.6;
    o.beginPath(); o.arc(rnd() * 200, rnd() * 200, 0.6 + rnd() * 2.2, 0, Math.PI * 2); o.fill();
  }
  // 한쪽이 살짝 흐린 압력 차이
  const fade = o.createLinearGradient(0, 0, 200, 200);
  fade.addColorStop(0, 'rgba(0,0,0,0)'); fade.addColorStop(1, 'rgba(0,0,0,.28)');
  o.globalAlpha = 1; o.fillStyle = fade; o.fillRect(0, 0, 200, 200);
  c.save();
  c.translate(x + size / 2, y + size / 2);
  c.rotate(rotDeg * Math.PI / 180);
  c.globalAlpha = 0.88;
  c.drawImage(off, -size / 2, -size / 2, size, size);
  c.restore();
}

function drawChip(c, x, y, w, h, rotated, silverChip) {
  // rotated=true 이면 세로 카드용으로 90도 돌려서 그림 (w,h는 화면상 크기)
  c.save();
  c.translate(x + w / 2, y + h / 2);
  if (rotated) { c.rotate(Math.PI / 2); [w, h] = [h, w]; }
  const X = -w / 2, Y = -h / 2;

  // 금속 판
  const g = c.createLinearGradient(X, Y, X + w, Y + h);
  const stops = silverChip
    ? ['#f4f5f7', '#c3c7ce', '#eceef1', '#a9aeb7', '#dfe2e6']
    : ['#f8e9ad', '#dcb860', '#f2da92', '#c39a3c', '#e6c878'];
  [0, 0.3, 0.55, 0.8, 1].forEach((t, i) => g.addColorStop(t, stops[i]));
  c.fillStyle = g;
  rr(c, X, Y, w, h, h * 0.16); c.fill();
  c.strokeStyle = silverChip ? 'rgba(90,95,105,.5)' : 'rgba(120,90,30,.55)'; c.lineWidth = 1.2;
  c.stroke();

  // 접점 분할선
  const line = silverChip ? 'rgba(80,86,96,.65)' : 'rgba(105,78,25,.7)';
  c.strokeStyle = line; c.lineWidth = 1.6; c.lineCap = 'round';
  const cl = X + w * 0.34, cr = X + w * 0.66;     // 가운데 패드 좌우
  const pt = Y + h * 0.16, pb = Y + h * 0.84;      // 가운데 패드 위아래
  const r = w * 0.07;

  // 가운데 패드
  rr(c, cl, pt, cr - cl, pb - pt, r); c.stroke();
  // 패드 위아래 연결선
  c.beginPath();
  c.moveTo(X + w / 2, Y); c.lineTo(X + w / 2, pt);
  c.moveTo(X + w / 2, pb); c.lineTo(X + w / 2, Y + h);
  c.stroke();

  // 좌우 접점 (각 4칸, 살짝 휘어지게)
  [0.27, 0.5, 0.73].forEach(t => {
    const yy = Y + h * t;
    c.beginPath();
    c.moveTo(X, yy);
    c.quadraticCurveTo(X + (cl - X) * 0.6, yy, cl, yy + (t - 0.5) * h * 0.18);
    c.moveTo(X + w, yy);
    c.quadraticCurveTo(X + w - (X + w - cr) * 0.6, yy, cr, yy + (t - 0.5) * h * 0.18);
    c.stroke();
  });

  // 하이라이트
  const hl = c.createLinearGradient(X, Y, X, Y + h);
  hl.addColorStop(0, 'rgba(255,255,255,.45)');
  hl.addColorStop(0.45, 'rgba(255,255,255,0)');
  c.fillStyle = hl;
  rr(c, X, Y, w, h, h * 0.16); c.fill();

  c.restore();
}

// 학번으로 카드번호/CVC/유효기간 자동 생성 (같은 학번이면 항상 같은 값)
function hashNum(str, len) {
  let h = 2166136261;
  let out = '';
  while (out.length < len) {
    for (const ch of str + out.length) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
    out += String(h % 10000).padStart(4, '0');
  }
  return out.slice(0, len);
}
const touched = { cardno: false, cvc: false, valid: false };
function autoFill(force) {
  const sid = $('sid').value.replace(/\D/g, '');
  if (!sid) return;
  const d = hashNum(sid, 15);
  if (force || !touched.cardno) $('cardno').value = `9410 ${d.slice(0, 4)} ${d.slice(4, 8)} ${d.slice(8, 12)}`;
  if (force || !touched.cvc) $('cvc').value = d.slice(12, 15);
  const year = parseInt(sid.slice(0, 4), 10);
  if ((force || !touched.valid) && year > 1950 && year < 2100) $('valid').value = `02/${String((year + 6) % 100).padStart(2, '0')}`;
}

}

  const reader = new FileReader();

[$('card'), $('back')].forEach(cv => {
  let drag = null;
  const local = e => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
    const pr = photoRects.get(cv); if (!pr) return null;
    const p = pr.m.inverse().transformPoint(new DOMPoint(x, y));
    return { x: p.x, y: p.y, pr };
  };
  cv.addEventListener('pointerdown', e => {
    if (!photoImg) return;
    const p = local(e); if (!p) return;
    const { pr } = p;
    if (p.x < pr.x || p.x > pr.x + pr.w || p.y < pr.y || p.y > pr.y + pr.h) return;
    drag = { sx: p.x, sy: p.y, ox: photoOX, oy: photoOY, pr };
    cv.setPointerCapture(e.pointerId); e.preventDefault();
  });
  cv.addEventListener('pointermove', e => {
    if (photoImg) { const p = local(e); const pr = p && p.pr;
      cv.style.cursor = drag || (pr && p.x >= pr.x && p.x <= pr.x + pr.w && p.y >= pr.y && p.y <= pr.y + pr.h) ? 'grab' : ''; }
    if (!drag) return;
    const p = local(e); if (!p) return;
    const sc = Math.max(drag.pr.w / photoImg.width, drag.pr.h / photoImg.height) * photoZoom;
    const ex = (photoImg.width * sc - drag.pr.w) / 2, ey = (photoImg.height * sc - drag.pr.h) / 2;
    const clamp = v => Math.max(-1, Math.min(1, v));
    if (ex > 0.5) photoOX = clamp(drag.ox + (p.x - drag.sx) / ex);
    if (ey > 0.5) photoOY = clamp(drag.oy + (p.y - drag.sy) / ey);
    draw();
  });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { drag = null; }));
  cv.addEventListener('wheel', e => {
    if (!photoImg) return;
    const p = local(e); if (!p) return; const { pr } = p;
    if (p.x < pr.x || p.x > pr.x + pr.w || p.y < pr.y || p.y > pr.y + pr.h) return;
    e.preventDefault();
    photoZoom = Math.max(1, Math.min(3, photoZoom * (e.deltaY < 0 ? 1.06 : 1 / 1.06)));
    $('zoom').value = photoZoom; draw();
  }, { passive: false });
});

document.querySelectorAll('.bgseg').forEach(seg => {
  const side = seg.dataset.side, file = $('bg_' + side);
  const setMode = m => { bgMode[side] = m; seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); draw(); };
  seg.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.m === 'image') { if (bgUser[side]) setMode('image'); file.click(); }
    else setMode(btn.dataset.m);
  }));
  file.addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => { const img = new Image(); img.onload = () => { bgUser[side] = img; setMode('image'); }; img.src = ev.target.result; };
    r.readAsDataURL(f); file.value = '';
  });
});

$('logoScale').addEventListener('input', e => { logoScale = +e.target.value; draw(); });
$('logoPosReset').addEventListener('click', () => { logoScale = 1; logoDX = logoDY = 0; $('logoScale').value = 1; draw(); });
[$('card'), $('back')].forEach(cv => {
  let drag = null;
  const hit = e => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
    for (const L of logoRects.get(cv) || []) {
      const p = L.m.inverse().transformPoint(new DOMPoint(x, y));
      if (p.x >= L.x && p.x <= L.x + L.w && p.y >= L.y && p.y <= L.y + L.h) return { L, p };
    }
    return null;
  };
  const toLocal = (e, L) => {
    const r = cv.getBoundingClientRect();
    return L.m.inverse().transformPoint(new DOMPoint((e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height));
  };
  cv.addEventListener('pointerdown', e => {
    const h = hit(e); if (!h) return;
    drag = { L: h.L, sx: h.p.x, sy: h.p.y, dx: logoDX, dy: logoDY };
    cv.setPointerCapture(e.pointerId); e.preventDefault(); e.stopImmediatePropagation();
  }, true);
  cv.addEventListener('pointermove', e => {
    if (!drag) { if (hit(e)) cv.style.cursor = 'move'; return; }
    const p = toLocal(e, drag.L);
    logoDX = Math.max(-2, Math.min(2, drag.dx + (p.x - drag.sx) / drag.L.bw));
    logoDY = Math.max(-2, Math.min(2, drag.dy + (p.y - drag.sy) / drag.L.bh));
    draw(); e.stopImmediatePropagation();
  }, true);
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { drag = null; }, true));
});

autoFill(true);
draw();
if (document.fonts) document.fonts.ready.then(draw);
</script>
</body>
</html>
